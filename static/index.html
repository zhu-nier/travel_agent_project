<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旅游助手</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f2f5; height: 100vh; display: flex; justify-content: center; align-items: center; }
.container { width: min(1000px, 100%); height: min(800px, 100dvh); background: #fff; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,.12); display: flex; flex-direction: column; overflow: hidden; }
.header { padding: 18px 24px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; display: flex; align-items: center; gap: 12px; }
.header h1 { font-size: 20px; font-weight: 600; }
.header .subtitle { font-size: 13px; opacity: .8; }
.chat-area { flex: 1; display: flex; overflow: hidden; }
.main-panel { min-width: 0; flex: 1; display: flex; flex-direction: column; }
.side-panel { width: 300px; border-left: 1px solid #eee; display: flex; flex-direction: column; }
.side-header { padding: 12px 16px; font-size: 13px; font-weight: 600; color: #666; border-bottom: 1px solid #eee; }
.side-body { flex: 1; overflow-y: auto; padding: 12px 16px; font-size: 13px; }
.tool-log-item { padding: 6px 0; border-bottom: 1px solid #f5f5f5; }
.tool-log-item .tool-name { color: #667eea; font-weight: 600; }
.tool-log-item .tool-args { color: #999; font-size: 12px; }
.tool-log-item .tool-result { color: #333; font-size: 12px; margin-top: 2px; }
.messages { flex: 1; overflow-y: auto; padding: 20px; }
.message { margin-bottom: 16px; display: flex; }
.message.user { justify-content: flex-end; }
.message.user .bubble { background: #667eea; color: #fff; border-radius: 18px 18px 4px 18px; }
.message.assistant { justify-content: flex-start; }
.message.assistant .bubble { background: #f0f2f5; color: #333; border-radius: 18px 18px 18px 4px; }
.bubble { max-width: 80%; padding: 10px 16px; line-height: 1.6; font-size: 14px; white-space: pre-wrap; word-break: break-word; }
.input-area { padding: 12px 20px; border-top: 1px solid #eee; display: flex; gap: 10px; }
.input-area input { min-width: 0; flex: 1; padding: 10px 16px; border: 1px solid #ddd; border-radius: 24px; outline: none; font-size: 14px; }
.input-area input:focus { border-color: #667eea; }
.input-area button { padding: 10px 24px; background: #667eea; color: #fff; border: none; border-radius: 24px; cursor: pointer; font-size: 14px; }
.input-area button:disabled { opacity: .5; cursor: not-allowed; }
.typing { display: flex; gap: 4px; padding: 8px 0; }
.typing span { width: 8px; height: 8px; background: #999; border-radius: 50%; animation: bounce 1.4s infinite; }
.typing span:nth-child(2) { animation-delay: .2s; }
.typing span:nth-child(3) { animation-delay: .4s; }
@keyframes bounce { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }
.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: #ccc; }
.empty-state .icon { font-size: 48px; margin-bottom: 12px; }
.empty-state p { font-size: 14px; }
.connecting { display: flex; align-items: center; gap: 8px; color: #999; font-size: 13px; padding: 8px 0; }
.spinner { width: 16px; height: 16px; border: 2px solid #ddd; border-top-color: #667eea; border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
[hidden] { display: none !important; }
.header-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.header-actions button { padding: 6px 10px; border-radius: 8px; border: 1px solid #ffffff80; background: #ffffff20; color: white; cursor: pointer; }
.header-actions button:disabled { opacity: .5; cursor: not-allowed; }
.tool-result { white-space: pre-wrap; overflow-wrap: anywhere; }
@media (max-width: 700px) {
  .container { border-radius: 0; }
  .side-panel { display: none; }
  .header { padding: 12px; flex-wrap: wrap; }
  .header-actions { font-size: 12px; }
  .messages { padding: 12px; }
  .bubble { max-width: 95%; }
  .input-area { padding: 10px; }
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    <div><h1>旅游助手</h1><div class="subtitle">旅行规划 · 天气与预算</div></div>
    <div class="header-actions">
      <span id="status" role="status">正在连接…</span>
      <button id="retryBtn" type="button" hidden>重新连接</button>
      <button id="resetBtn" type="button" disabled>新对话</button>
    </div>
  </div>
  <div class="chat-area">
    <div class="main-panel">
      <div class="messages" id="messages" role="log" aria-live="polite">
        <div class="empty-state" id="emptyState">
          <div class="icon">&#127757;</div>
          <p>正在连接后端服务...</p>
          <div class="connecting"><div class="spinner"></div><span>初始化 MCP 工具链</span></div>
        </div>
      </div>
      <div class="input-area">
        <input id="input" aria-label="旅行需求" maxlength="4000" placeholder="等待连接就绪..." disabled>
        <button id="sendBtn" disabled>发送</button>
      </div>
    </div>
    <div class="side-panel">
      <div class="side-header">&#9881; 工具调用日志</div>
      <div class="side-body" id="toolLog"><div style="color:#ccc;text-align:center;margin-top:40px">等待输入...</div></div>
    </div>
  </div>
</div>
<script>
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const toolLog = document.getElementById('toolLog');
const emptyState = document.getElementById('emptyState');
const statusEl = document.getElementById('status');
const resetBtn = document.getElementById('resetBtn');
const retryBtn = document.getElementById('retryBtn');
const toolEntries = new Map();

let ws = null;
let connected = false;
let busy = false;
let retries = 0;
let reconnectTimer = null;
let receivedReady = false;
let reconnectAllowed = true;

function updateControls() {
  inputEl.disabled = !connected || busy;
  sendBtn.disabled = !connected || busy || !inputEl.value.trim();
  resetBtn.disabled = !connected || busy;
  retryBtn.hidden = connected;
}

function setStatus(text) {
  statusEl.textContent = text;
}

function connect() {
  clearTimeout(reconnectTimer);
  if (ws && ws.readyState <= WebSocket.OPEN) return;
  connected = false;
  reconnectAllowed = true;
  updateControls();
  setStatus('正在连接…');
  const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const socket = new WebSocket(protocol + '//' + location.host + '/ws');
  ws = socket;
  socket.onmessage = event => {
    if (socket !== ws) return;
    let data;
    try { data = JSON.parse(event.data); }
    catch { setStatus('收到无效响应，请重新连接'); return; }
    switch (data.type) {
      case 'ready':
        connected = true;
        busy = false;
        retries = 0;
        if (receivedReady) {
          addMessage('连接已恢复，已开始新对话。请重新提供旅行需求。', 'assistant');
        } else {
          emptyState.querySelector('p').textContent = '输入城市、月份、天数和预算，开始规划旅程';
          emptyState.querySelector('.connecting').hidden = true;
        }
        receivedReady = true;
        setStatus('已连接');
        inputEl.placeholder = '例如：北京，6月，3天，预算2000元';
        inputEl.focus();
        break;
      case 'tool_call':
        addToolLog(data.call_id, data.tool, data.args || {});
        break;
      case 'tool_result':
        updateToolLog(data.call_id, data.result);
        break;
      case 'ai_message':
        removeTyping();
        addMessage(data.content, 'assistant');
        break;
      case 'turn_done':
        busy = false;
        removeTyping();
        setStatus('已连接');
        inputEl.disabled = false;
        inputEl.focus();
        break;
      case 'reset_done':
        messagesEl.replaceChildren();
        toolLog.replaceChildren();
        toolEntries.clear();
        busy = false;
        setStatus('新对话已就绪');
        addMessage('已开始新对话，请提供城市、月份、天数和预算。', 'assistant');
        break;
      case 'error':
        busy = false;
        removeTyping();
        addMessage('提示：' + data.content, 'assistant');
        setStatus('处理失败，请检查配置或重试');
        break;
      case 'busy':
        setStatus(data.content || '正在规划…');
        break;
      case 'done':
        reconnectAllowed = false;
        connected = false;
        busy = false;
        setStatus('对话已结束');
        break;
    }
    updateControls();
  };
  socket.onclose = event => {
    if (socket !== ws) return;
    connected = false;
    busy = false;
    removeTyping();
    updateControls();
    if (reconnectAllowed && event.code !== 1011 && event.code !== 1008 && retries < 4) {
      const delay = Math.min(1000 * 2 ** retries++, 10000);
      setStatus('连接断开，正在重连…');
      reconnectTimer = setTimeout(connect, delay);
    } else {
      setStatus('连接已断开，请检查服务后点击重新连接');
    }
  };
  socket.onerror = () => setStatus('连接失败，请确认后端服务已启动');
}

function sendMessage() {
  const text = inputEl.value.trim();
  if (!text || !connected || busy || !ws || ws.readyState !== WebSocket.OPEN) return;
  if (text.length > 4000) {
    setStatus('每条消息最多4000个字符');
    return;
  }
  try {
    ws.send(JSON.stringify({type: 'message', content: text}));
  } catch {
    setStatus('发送失败，请重新连接');
    return;
  }
  addMessage(text, 'user');
  addTyping();
  inputEl.value = '';
  busy = true;
  toolLog.replaceChildren();
  toolEntries.clear();
  setStatus('正在规划…');
  updateControls();
}

function addMessage(text, role) {
  emptyState.hidden = true;
  const row = document.createElement('div');
  row.className = 'message ' + role;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  // Treat model, user and tool strings as text, never executable markup.
  bubble.textContent = String(text ?? '');
  row.appendChild(bubble);
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function addTyping() {
  removeTyping();
  const row = document.createElement('div');
  row.className = 'message assistant';
  row.id = 'typingIndicator';
  const dots = document.createElement('div');
  dots.className = 'typing';
  dots.setAttribute('aria-label', '正在生成回复');
  for (let i = 0; i < 3; i++) dots.appendChild(document.createElement('span'));
  row.appendChild(dots);
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function removeTyping() {
  document.getElementById('typingIndicator')?.remove();
}

function addToolLog(id, name, args) {
  const row = document.createElement('div');
  row.className = 'tool-log-item';
  const label = document.createElement('div');
  label.className = 'tool-name';
  label.textContent = name;
  const params = document.createElement('div');
  params.className = 'tool-args';
  params.textContent = Object.entries(args).map(([key, value]) => key + '=' + JSON.stringify(value)).join(', ');
  const result = document.createElement('div');
  result.className = 'tool-result';
  result.textContent = '执行中…';
  row.append(label, params, result);
  toolLog.prepend(row);
  toolEntries.set(id, result);
}

function updateToolLog(id, result) {
  const node = toolEntries.get(id);
  if (node) node.textContent = String(result ?? '');
}

inputEl.addEventListener('input', updateControls);
inputEl.addEventListener('keydown', event => {
  if (event.key === 'Enter' && !event.isComposing) {
    event.preventDefault();
    sendMessage();
  }
});
sendBtn.addEventListener('click', sendMessage);
resetBtn.addEventListener('click', () => {
  if (!connected || busy || ws.readyState !== WebSocket.OPEN) return;
  busy = true;
  updateControls();
  ws.send(JSON.stringify({type: 'reset'}));
});
retryBtn.addEventListener('click', () => {
  retries = 0;
  connect();
});
window.addEventListener('beforeunload', () => {
  reconnectAllowed = false;
  clearTimeout(reconnectTimer);
  ws?.close();
});
connect();
</script>
</body>
</html>
