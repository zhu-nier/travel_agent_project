<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旅游助手</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f2f5; height: 100vh; display: flex; justify-content: center; align-items: center; }
.container { width: 1000px; height: 700px; background: #fff; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,.12); display: flex; flex-direction: column; overflow: hidden; }
.header { padding: 18px 24px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; display: flex; align-items: center; gap: 12px; }
.header h1 { font-size: 20px; font-weight: 600; }
.header .subtitle { font-size: 13px; opacity: .8; }
.chat-area { flex: 1; display: flex; overflow: hidden; }
.main-panel { flex: 1; display: flex; flex-direction: column; }
.side-panel { width: 300px; border-left: 1px solid #eee; display: flex; flex-direction: column; }
.side-header { padding: 12px 16px; font-size: 13px; font-weight: 600; color: #666; border-bottom: 1px solid #eee; }
.side-body { flex: 1; overflow-y: auto; padding: 12px 16px; font-size: 13px; }
.tool-log-item { padding: 6px 0; border-bottom: 1px solid #f5f5f5; }
.tool-log-item .tool-name { color: #667eea; font-weight: 600; }
.tool-log-item .tool-args { color: #999; font-size: 12px; }
.tool-log-item .tool-result { color: #333; font-size: 12px; margin-top: 2px; }
.messages { flex: 1; overflow-y: auto; padding: 20px; }
.message { margin-bottom: 16px; display: flex; }
.message.user { justify-content: flex-end; }
.message.user .bubble { background: #667eea; color: #fff; border-radius: 18px 18px 4px 18px; }
.message.assistant { justify-content: flex-start; }
.message.assistant .bubble { background: #f0f2f5; color: #333; border-radius: 18px 18px 18px 4px; }
.bubble { max-width: 80%; padding: 10px 16px; line-height: 1.6; font-size: 14px; white-space: pre-wrap; word-break: break-word; }
.input-area { padding: 12px 20px; border-top: 1px solid #eee; display: flex; gap: 10px; }
.input-area input { flex: 1; padding: 10px 16px; border: 1px solid #ddd; border-radius: 24px; outline: none; font-size: 14px; }
.input-area input:focus { border-color: #667eea; }
.input-area button { padding: 10px 24px; background: #667eea; color: #fff; border: none; border-radius: 24px; cursor: pointer; font-size: 14px; }
.input-area button:disabled { opacity: .5; cursor: not-allowed; }
.typing { display: flex; gap: 4px; padding: 8px 0; }
.typing span { width: 8px; height: 8px; background: #999; border-radius: 50%; animation: bounce 1.4s infinite; }
.typing span:nth-child(2) { animation-delay: .2s; }
.typing span:nth-child(3) { animation-delay: .4s; }
@keyframes bounce { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }
.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: #ccc; }
.empty-state .icon { font-size: 48px; margin-bottom: 12px; }
.empty-state p { font-size: 14px; }
.connecting { display: flex; align-items: center; gap: 8px; color: #999; font-size: 13px; padding: 8px 0; }
.spinner { width: 16px; height: 16px; border: 2px solid #ddd; border-top-color: #667eea; border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    <div><h1>旅游助手</h1><div class="subtitle">10 个工具 · 深度规划</div></div>
  </div>
  <div class="chat-area">
    <div class="main-panel">
      <div class="messages" id="messages">
        <div class="empty-state" id="emptyState">
          <div class="icon">&#127757;</div>
          <p>正在连接后端服务...</p>
          <div class="connecting"><div class="spinner"></div><span>初始化 MCP 工具链</span></div>
        </div>
      </div>
      <div class="input-area">
        <input id="input" placeholder="等待连接就绪..." disabled>
        <button id="sendBtn" disabled>发送</button>
      </div>
    </div>
    <div class="side-panel">
      <div class="side-header">&#9881; 工具调用日志</div>
      <div class="side-body" id="toolLog"><div style="color:#ccc;text-align:center;margin-top:40px">等待输入...</div></div>
    </div>
  </div>
</div>
<script>
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const toolLog = document.getElementById('toolLog');
const emptyState = document.getElementById('emptyState');

let ws = null;
let connected = false;

function connect() {
  ws = new WebSocket(`ws://${location.host}/ws`);

  ws.onopen = () => {};

  ws.onmessage = e => {
    const data = JSON.parse(e.data);

    switch (data.type) {
      case 'ready':
        connected = true;
        emptyState.innerHTML = '<div class="icon">&#127757;</div><p>输入目的地，开始规划你的旅程</p><p style="font-size:12px;color:#ddd;margin-top:4px">例如: 去北京3天，6月，预算2000，喜欢历史</p>';
        inputEl.disabled = false;
        inputEl.placeholder = '输入你的旅行需求...';
        sendBtn.disabled = false;
        inputEl.focus();
        break;

      case 'tool_call':
        addToolLog(data.tool, data.args);
        break;

      case 'tool_result':
        updateToolLog(data.tool, data.result);
        break;

      case 'ai_message':
        removeTyping();
        addMessage(data.content, 'assistant');
        break;

      case 'turn_done':
        removeTyping();
        sendBtn.disabled = false;
        inputEl.disabled = false;
        inputEl.focus();
        break;

      case 'error':
        removeTyping();
        addMessage('错误: ' + data.content, 'assistant');
        sendBtn.disabled = false;
        inputEl.disabled = false;
        break;
    }
  };

  ws.onclose = () => {
    connected = false;
    if (emptyState) {
      emptyState.innerHTML = '<div class="icon">&#128275;</div><p>连接断开，正在重连...</p><div class="connecting"><div class="spinner"></div><span>重连中</span></div>';
    }
    setTimeout(connect, 2000);
  };

  ws.onerror = () => {};
}

function sendMessage() {
  const text = inputEl.value.trim();
  if (!text || !connected) return;
  addMessage(text, 'user');
  addTyping();
  inputEl.value = '';
  sendBtn.disabled = true;
  inputEl.disabled = true;
  toolLog.innerHTML = '';
  ws.send(JSON.stringify({ type: 'message', content: text }));
}

function addMessage(text, role) {
  const div = document.createElement('div');
  div.className = `message ${role}`;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';

  let display = text
    .replace(/【([^】]+)】/g, '<strong style="font-size:15px;color:#667eea">$1</strong>')
    .replace(/===== ([^=]+) =====/g, '<br><strong style="color:#764ba2;font-size:15px">$1</strong>')
    .replace(/(第\d+天:)/g, '<br><strong style="font-size:14px;margin-top:6px;display:inline-block">$1</strong>')
    .replace(/\n/g, '<br>');

  bubble.innerHTML = display;
  div.appendChild(bubble);
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function addTyping() {
  removeTyping();
  const div = document.createElement('div');
  div.className = 'message assistant';
  div.id = 'typingIndicator';
  div.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function removeTyping() {
  const el = document.getElementById('typingIndicator');
  if (el) el.remove();
}

function addToolLog(name, args) {
  const div = document.createElement('div');
  div.className = 'tool-log-item';
  const argsStr = Object.entries(args).map(([k,v]) => `${k}=${v}`).join(', ');
  div.innerHTML = `<div><span class="tool-name">${name}</span> <span style="color:#999;font-size:12px">(${argsStr})</span></div>
    <div class="tool-result" style="color:#999">执行中...</div>`;
  toolLog.prepend(div);
}

function updateToolLog(name, result) {
  const items = toolLog.querySelectorAll('.tool-log-item');
  for (const item of items) {
    const nameEl = item.querySelector('.tool-name');
    if (nameEl && nameEl.textContent === name) {
      const resultDiv = item.querySelector('.tool-result');
      if (resultDiv) {
        resultDiv.textContent = result;
        resultDiv.style.color = '#333';
      }
      break;
    }
  }
}

inputEl.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });
sendBtn.addEventListener('click', sendMessage);

connect();
</script>
</body>
</html>
